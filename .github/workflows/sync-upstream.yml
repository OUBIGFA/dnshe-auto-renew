name: Sync upstream template files

on:
  schedule:
    - cron: '42 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: OUBIGFA/dnshe-auto-renew
  # 以本仓库为准、永不被上游覆盖的路径（空格分隔，可自行追加）。
  #
  # 只有 state/domains-state.json：它是每个仓库自己的运行状态（域名的到期时间）。
  # 一旦被上游的空种子覆盖，续期判断就会退回"每次用 created_at 重算"，
  # 导致同一域名每周重复调用续期接口。
  #
  # Secrets 和 Variables（DNSHE_API_KEY、DNSHE_DOMAINS 等）存在 GitHub
  # 仓库设置里，不在文件树内，本工作流碰不到它们。
  PROTECTED_PATHS: state/domains-state.json
# 与续期工作流共用同一个组：两者都往 main 推送，串行执行避免 non-fast-forward。
# 注意：另一个工作流必须使用相同的 group 名才生效。
concurrency:
  group: dnshe-main-write
  cancel-in-progress: false

jobs:
  sync-upstream-template:
    runs-on: ubuntu-latest

    steps:
      - name: Check out your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 默认的 GITHUB_TOKEN 无法创建或修改 .github/workflows/ 下的文件，
          # 这是平台级限制：permissions 块里没有 workflows 这一项，仓库设置里的
          # "Read and write permissions" 也无效。想在同步里带上工作流，需要配一个
          # 细粒度 PAT（Contents: Read/write + Workflows: Read/write）并保存为
          # SYNC_TOKEN 密钥。注意 PAT 必须给 checkout，只给 push 步骤传是无效的
          # —— checkout 已经把凭据写进 git config 了。没配则回退默认 token。
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Skip if this IS the upstream repository
        id: guard
        run: |
          if [ "${{ github.repository }}" = "$UPSTREAM" ]; then
            echo "Running on the upstream repo itself, skip syncing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add upstream remote and fetch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/$UPSTREAM.git"
          git fetch upstream main --depth=1

      - name: Mirror upstream, then restore protected paths
        if: steps.guard.outputs.skip != 'true'
        env:
          # 是否具备写工作流文件的权限（值本身不打印）
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          # 没有 SYNC_TOKEN 时默认 token 推不动 .github/workflows/，
          # 直接把该目录并进保护名单：整体降级为"除工作流外全同步"，
          # 而不是让整个同步因为推送被拒而失败。
          PROTECT="$PROTECTED_PATHS"
          if [ "$HAS_SYNC_TOKEN" != "true" ]; then
            PROTECT="$PROTECT .github/workflows"
            echo "未配置 SYNC_TOKEN：本次不同步 .github/workflows/，保留本仓库版本。"
          fi

          # 1) 先把保护路径连同相对目录一起存到临时目录
          STASH="$(mktemp -d)"
          for path in $PROTECT; do
            if [ -e "$path" ]; then
              mkdir -p "$STASH/$(dirname "$path")"
              cp -a "$path" "$STASH/$path"
              # 镜像前先移走，确保上游版本绝不会残留、也不会与本地版本混淆
              rm -rf -- "$path"
            fi
          done

          # 2) 清空受版本控制的内容，再整体取上游主干。
          #    先清空是为了让"上游删掉的文件"本地也同步删除 —— 只做 checkout
          #    无法删除本地多余文件，达不到整仓库对齐。
          #    -f 是必须的：工作区若被上一次运行改过，git rm 默认会拒绝执行。
          git rm -rfq --ignore-unmatch -- .
          git checkout upstream/main -- .

          # 3) 兜底：上游内容没取到就中止，避免把"整仓库被删空"的提交推上去。
          #    （run 步骤默认 bash -e，任何一步非零退出都会直接失败。）
          if [ ! -f README.md ] || [ ! -d scripts ]; then
            echo "::error::Upstream checkout incomplete, aborting without commit."
            exit 1
          fi

          # 4) 放回保护路径，以本仓库内容为准，并只把它们重新加回索引。
          #    这里刻意不用 git add -A：那会把本仓库的未跟踪文件也提交进来，
          #    而它们下次同步又会被当成"上游没有的文件"删掉。
          for path in $PROTECT; do
            if [ -e "$STASH/$path" ]; then
              # 必须先删掉目标再拷：目标若是已存在的目录（上游 checkout 会重建它），
              # cp -a 会把源目录整个塞进去，变成 .github/workflows/workflows 这种层级。
              rm -rf -- "$path"
              mkdir -p "$(dirname "$path")"
              cp -a "$STASH/$path" "$path"
              git add -A -- "$path"
            fi
          done

          echo "--- staged changes ---"
          git diff --cached --stat

      - name: Commit and push if changed
        if: steps.guard.outputs.skip != 'true'
        run: |
          # 只看已暂存的改动：本仓库未跟踪的文件不应该触发提交。
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Template files already match upstream, nothing to commit."
            exit 0
          fi
          git commit -m "chore(template): sync upstream from $UPSTREAM [auto]"
          # 期间可能有别的提交落到 main（例如续期状态更新），先变基再推。
          git pull --rebase origin "${{ github.ref_name }}"
          git push
